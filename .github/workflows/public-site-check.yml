name: Public Website Checks
on:
  push:
    branches: [feature/public_site_port, feature/staff_crm_better_auth]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.15.0"
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure isolated local staff-auth test
        run: |
          printf '%s\n' 'BETTER_AUTH_URL=http://localhost:4173' 'BETTER_AUTH_SECRET=ci-not-a-production-secret-0123456789-abcdefgh' > .env
          chmod 600 .env
      - name: Generate Cloudflare Worker types
        run: pnpm run cf-typegen
      - name: Verify types
        run: pnpm exec tsc --noEmit
      - name: Reject destructive migrations before any deployment
        run: node scripts/check-d1-migrations.mjs
      - name: Apply public D1 migrations locally
        run: |
          DB=d6f3e4e9-2190-43bf-bc90-969687f6db78
          pnpm exec cf d1 migrations apply "$DB" --local --persist-to .cloudflare/state
          pnpm exec cf d1 raw "$DB" --sql "SELECT COUNT(*) AS published FROM public_programme_offerings WHERE show_on_website = 1" --local --persist-to .cloudflare/state
      - name: Create synthetic Cloudflare D1 owner setup ticket (local only)
        run: |
          DB=d6f3e4e9-2190-43bf-bc90-969687f6db78
          pnpm exec cf d1 raw "$DB" --local --persist-to .cloudflare/state --sql "INSERT INTO staff_owner_setup (id,email,display_name,token,expires_at) VALUES ('first-owner','staff-ci@example.invalid','Synthetic Staff Owner','aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa',strftime('%Y-%m-%dT%H:%M:%fZ','now','+30 minutes'))" > /tmp/setup-ticket.json
      - name: Build Cloudflare Worker
        run: pnpm run build

      - name: Validate Cloudflare configuration (no upload)
        run: pnpm exec cf deploy --prebuilt --mode production --dry-run

      - name: Smoke test public routes and D1 enquiry
        shell: bash
        run: |
          set -euo pipefail
          DB=d6f3e4e9-2190-43bf-bc90-969687f6db78
          pnpm run start >/tmp/sohojac-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS --max-time 4 http://localhost:4173/ >/tmp/sohojac-home.html 2>/dev/null; then break; fi
            sleep 1
          done
          for route in / /about /faq /journal /interest /privacy /robots.txt /sitemap.xml; do
            curl -fsS --retry 3 --retry-all-errors --retry-delay 1 --max-time 12 "http://localhost:4173$route" >/tmp/route-check || {
              cat /tmp/sohojac-vite.log
              exit 1
            }
          done
          grep -q "Learning should be" /tmp/sohojac-home.html
          curl -fsS --max-time 20 -X POST "http://localhost:4173/api/enquiries" \
            -H "Content-Type: application/json" \
            --data '{"intent":"interest","offeringId":"","studentName":"Smoke Test Student","className":"Class 8","guardianName":"Smoke Test Guardian","mobile":"01700000000","subjectNames":["English"],"preferredSchedule":"","preferredDays":[],"trialInterest":false,"consent":true,"website":"","turnstileToken":""}' \
            >/tmp/sohojac-enquiry.json || {
              cat /tmp/sohojac-vite.log
              cat /tmp/sohojac-enquiry.json || true
              exit 1
            }
          # Private staff resources are never readable anonymously.
          private_status=$(curl -sS -o /tmp/sohojac-private.json -w '%{http_code}' "http://localhost:4173/api/staff/prospects")
          test "$private_status" = "401"
          private_update_status=$(curl -sS -o /tmp/sohojac-private-update.json -w '%{http_code}' \
            -X PATCH "http://localhost:4173/api/staff/prospects/00000000-0000-0000-0000-000000000000" \
            -H "Origin: http://localhost:4173" -H "Content-Type: application/json" \
            --data '{"status":"CLOSED","note":"Unauthorized"}')
          test "$private_update_status" = "401"
          signin_signup_status=$(curl -sS -o /tmp/sohojac-signup.json -w '%{http_code}' \
            -X POST "http://localhost:4173/api/auth/sign-up/email" \
            -H "Origin: http://localhost:4173" -H "Content-Type: application/json" \
            --data '{"name":"Attacker","email":"attacker@example.invalid","password":"notasecret123456"}')
          # Public self-signup must stay blocked even when staff auth is configured.
          test "$signin_signup_status" -ge 400

          # Cloudflare Dashboard issues the only setup ticket. A wrong ticket
          # must fail; a correct ticket creates user + account + OWNER in D1.
          bad_setup=$(curl -sS -o /tmp/bad-setup.json -w '%{http_code}' \
            -X POST "http://localhost:4173/api/setup-owner" \
            -H "Origin: http://localhost:4173" -H "Content-Type: application/json" \
            --data '{"token":"bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb","password":"Test123!"}')
          test "$bad_setup" = "403"
          owner_setup=$(curl -sS -o /tmp/owner-setup.json -w '%{http_code}' \
            -X POST "http://localhost:4173/api/setup-owner" \
            -H "Origin: http://localhost:4173" -H "Content-Type: application/json" \
            --data '{"token":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","password":"Test123!"}')
          echo "first owner setup HTTP: $owner_setup"
          test "$owner_setup" = "201"
          reused_setup=$(curl -sS -o /tmp/reused-setup.json -w '%{http_code}' \
            -X POST "http://localhost:4173/api/setup-owner" \
            -H "Origin: http://localhost:4173" -H "Content-Type: application/json" \
            --data '{"token":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","password":"Test123!"}')
          test "$reused_setup" = "403"

          # Real Better Auth sign-in and D1 role check with a synthetic local
          # staff user. No production secrets or real guardian data are used.
          signin_status=$(curl -sS -o /tmp/staff-signin.json -w '%{http_code}' \
            -c /tmp/staff-ci-cookies -X POST "http://localhost:4173/api/auth/sign-in/email" \
            -H "Origin: http://localhost:4173" -H "Content-Type: application/json" \
            --data '{"email":"staff-ci@example.invalid","password":"Test123!"}')
          echo "staff sign-in HTTP status: $signin_status"
          test "$signin_status" = "200"
          staff_list_status=$(curl -sS -o /tmp/staff-prospects.json -w '%{http_code}' \
            -b /tmp/staff-ci-cookies "http://localhost:4173/api/staff/prospects")
          test "$staff_list_status" = "200"

          # Server-rendered staff pages also require the valid owner session.
          for route in /app /app/prospects; do
            code=$(curl -sS -o /tmp/sohojac-staff-page.html -w '%{http_code}' \
              -b /tmp/staff-ci-cookies "http://localhost:4173$route")
            echo "authorized $route HTTP: $code"
            test "$code" = "200"
          done

          # Only the role-authorized owner can update the synthetic enquiry.
          enquiry_id=$(node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync("/tmp/staff-prospects.json","utf8"));if(!d.items?.length)process.exit(1);process.stdout.write(d.items[0].id)')
          staff_update_status=$(curl -sS -o /tmp/staff-update.json -w '%{http_code}' \
            -b /tmp/staff-ci-cookies -X PATCH "http://localhost:4173/api/staff/prospects/$enquiry_id" \
            -H "Origin: http://localhost:4173" -H "Content-Type: application/json" \
            --data '{"status":"CONTACTED","note":"CI follow-up test"}')
          echo "authorized staff update HTTP status: $staff_update_status"
          test "$staff_update_status" = "200"
          history_status=$(curl -sS -o /tmp/staff-history.json -w '%{http_code}' \
            -b /tmp/staff-ci-cookies "http://localhost:4173/api/staff/prospects/$enquiry_id")
          test "$history_status" = "200"
          grep -q 'CI follow-up test' /tmp/staff-history.json


          # Academic-year production candidate (local D1; no real student data).
          echo "Testing academic year create, activation, uniqueness, concurrency and close"
          unauthed_year=$(curl -sS -o /tmp/year-anonymous.json -w '%{http_code}' "http://localhost:4173/api/staff/academic-years")
          test "$unauthed_year" = "401"
          unauthed_year_post=$(curl -sS -o /tmp/year-anonymous-write.json -w '%{http_code}' -X POST "http://localhost:4173/api/staff/academic-years" -H "Content-Type: application/json" --data '{}')
          test "$unauthed_year_post" = "401"
          year_created=$(curl -sS -o /tmp/year-created.json -w '%{http_code}' -b /tmp/staff-ci-cookies \
            -X POST "http://localhost:4173/api/staff/academic-years" -H "Origin: http://localhost:4173" -H "Content-Type: application/json" \
            --data '{"code":"2027","title":"Academic Year 2027","startsOn":"2027-01-01","endsOn":"2027-12-31"}')
          test "$year_created" = "201"
          year_id=$(node -e 'const r=require("/tmp/year-created.json");if(r.status!=="DRAFT")process.exit(1);process.stdout.write(r.id)')
          duplicate_year=$(curl -sS -o /tmp/year-duplicate.json -w '%{http_code}' -b /tmp/staff-ci-cookies \
            -X POST "http://localhost:4173/api/staff/academic-years" -H "Origin: http://localhost:4173" -H "Content-Type: application/json" \
            --data '{"code":"2027","title":"Academic Year 2027","startsOn":"","endsOn":""}')
          test "$duplicate_year" = "409"
          year_activated=$(curl -sS -o /tmp/year-active.json -w '%{http_code}' -b /tmp/staff-ci-cookies \
            -X PATCH "http://localhost:4173/api/staff/academic-years/$year_id" -H "Origin: http://localhost:4173" -H "Content-Type: application/json" \
            --data '{"title":"Academic Year 2027","startsOn":"2027-01-01","endsOn":"2027-12-31","nextStatus":"ACTIVE","expectedVersion":1,"reason":"Approved first active year"}')
          test "$year_activated" = "200"
          second_year=$(curl -sS -o /tmp/second-year.json -w '%{http_code}' -b /tmp/staff-ci-cookies \
            -X POST "http://localhost:4173/api/staff/academic-years" -H "Origin: http://localhost:4173" -H "Content-Type: application/json" \
            --data '{"code":"2028","title":"Academic Year 2028","startsOn":"","endsOn":""}')
          test "$second_year" = "201"
          year_second_id=$(node -e 'process.stdout.write(require("/tmp/second-year.json").id)')
          second_activation=$(curl -sS -o /tmp/second-year-conflict.json -w '%{http_code}' -b /tmp/staff-ci-cookies \
            -X PATCH "http://localhost:4173/api/staff/academic-years/$year_second_id" -H "Origin: http://localhost:4173" -H "Content-Type: application/json" \
            --data '{"title":"Academic Year 2028","startsOn":"","endsOn":"","nextStatus":"ACTIVE","expectedVersion":1,"reason":"Second active year is forbidden"}')
          test "$second_activation" = "409"
          stale_year=$(curl -sS -o /tmp/stale-year.json -w '%{http_code}' -b /tmp/staff-ci-cookies \
            -X PATCH "http://localhost:4173/api/staff/academic-years/$year_id" -H "Origin: http://localhost:4173" -H "Content-Type: application/json" \
            --data '{"title":"Stale Academic Year","startsOn":"","endsOn":"","nextStatus":"ACTIVE","expectedVersion":1,"reason":"Old version must be rejected"}')
          test "$stale_year" = "409"
          year_closed=$(curl -sS -o /tmp/year-closed.json -w '%{http_code}' -b /tmp/staff-ci-cookies \
            -X PATCH "http://localhost:4173/api/staff/academic-years/$year_id" -H "Origin: http://localhost:4173" -H "Content-Type: application/json" \
            --data '{"title":"Academic Year 2027","startsOn":"2027-01-01","endsOn":"2027-12-31","nextStatus":"CLOSED","expectedVersion":2,"reason":"Year closed following approval"}')
          test "$year_closed" = "200"
          years_page=$(curl -sS -o /tmp/academic-years-page.html -w '%{http_code}' -b /tmp/staff-ci-cookies "http://localhost:4173/app/academic-years")
          test "$years_page" = "200"
          pnpm exec cf d1 raw "$DB" --local --persist-to .cloudflare/state \
            --sql "SELECT (SELECT COUNT(*) FROM academic_years WHERE status='ACTIVE'),(SELECT COUNT(*) FROM academic_years WHERE status='CLOSED' AND version=3),(SELECT COUNT(*) FROM erp_audit_events WHERE entity_type='academic_year')" > /tmp/academic-year-ci.json
          node -e 'const r=require("/tmp/academic-year-ci.json")[0]?.results?.rows?.[0];if(r?.[0]!==0||r?.[1]!==1||r?.[2]!==4)process.exit(1)'


          # Release 2: safely create, publish, close and audit programme offerings.
          echo "Testing programme offering lifecycle"
          anonymous_offering=$(curl -sS -o /tmp/anon-offering.json -w '%{http_code}' "http://localhost:4173/api/staff/offerings")
          test "$anonymous_offering" = "401"
          created_offering=$(curl -sS -o /tmp/new-offering.json -w '%{http_code}' -b /tmp/staff-ci-cookies \
            -X POST "http://localhost:4173/api/staff/offerings" -H "Origin: http://localhost:4173" -H "Content-Type: application/json" \
            --data '{"code":"CI_OFFER_2027","name":"Synthetic Test Programme","className":"Class 10","academicYearName":"2027","branchName":"Sohoj Academy","groupName":"Science","reason":"CI verifies isolated offering creation"}')
          test "$created_offering" = "201"
          offering_id=$(node -e 'const r=require("/tmp/new-offering.json");if(r.status!=="CLOSED"||r.published!==false)process.exit(1);process.stdout.write(r.id)')
          invalid_open=$(curl -sS -o /tmp/offering-invalid-open.json -w '%{http_code}' -b /tmp/staff-ci-cookies \
            -X PATCH "http://localhost:4173/api/staff/offerings/$offering_id" -H "Origin: http://localhost:4173" -H "Content-Type: application/json" \
            --data '{"expectedVersion":1,"name":"Synthetic Test Programme","className":"Class 10","academicYearName":"2027","branchName":"Sohoj Academy","groupName":"Science","showcaseTitle":"Test Programme","showcaseTitleBn":"","showcaseDescription":"","showcaseDescriptionBn":"","publicSchedule":"","publicScheduleBn":"","showOnWebsite":false,"isActive":false,"applicationState":"OPEN","sortOrder":999,"reason":"Opening unpublished programmes forbidden"}')
          test "$invalid_open" = "400"
          published_offering=$(curl -sS -o /tmp/published-offering.json -w '%{http_code}' -b /tmp/staff-ci-cookies \
            -X PATCH "http://localhost:4173/api/staff/offerings/$offering_id" -H "Origin: http://localhost:4173" -H "Content-Type: application/json" \
            --data '{"expectedVersion":1,"name":"Synthetic Test Programme","className":"Class 10","academicYearName":"2027","branchName":"Sohoj Academy","groupName":"Science","showcaseTitle":"Synthetic Test Programme","showcaseTitleBn":"","showcaseDescription":"","showcaseDescriptionBn":"","publicSchedule":"","publicScheduleBn":"","showOnWebsite":true,"isActive":true,"applicationState":"OPEN","sortOrder":999,"reason":"CI verifies controlled publication"}')
          test "$published_offering" = "200"
          node -e 'const d=require("/tmp/published-offering.json");if(d.isAcceptingApplications!==true||d.version!==2)process.exit(1)'
          stale_offering=$(curl -sS -o /tmp/stale-offering.json -w '%{http_code}' -b /tmp/staff-ci-cookies \
            -X PATCH "http://localhost:4173/api/staff/offerings/$offering_id" -H "Origin: http://localhost:4173" -H "Content-Type: application/json" \
            --data '{"expectedVersion":1,"name":"Synthetic Test Programme","className":"Class 10","academicYearName":"2027","branchName":"Sohoj Academy","groupName":"Science","showcaseTitle":"Test","showcaseTitleBn":"","showcaseDescription":"","showcaseDescriptionBn":"","publicSchedule":"","publicScheduleBn":"","showOnWebsite":true,"isActive":true,"applicationState":"OPEN","sortOrder":999,"reason":"Stale update must be rejected"}')
          test "$stale_offering" = "409"
          closed_offering=$(curl -sS -o /tmp/closed-offering.json -w '%{http_code}' -b /tmp/staff-ci-cookies \
            -X PATCH "http://localhost:4173/api/staff/offerings/$offering_id" -H "Origin: http://localhost:4173" -H "Content-Type: application/json" \
            --data '{"expectedVersion":2,"name":"Synthetic Test Programme","className":"Class 10","academicYearName":"2027","branchName":"Sohoj Academy","groupName":"Science","showcaseTitle":"Synthetic Test Programme","showcaseTitleBn":"","showcaseDescription":"","showcaseDescriptionBn":"","publicSchedule":"","publicScheduleBn":"","showOnWebsite":false,"isActive":false,"applicationState":"CLOSED","sortOrder":999,"reason":"CI unpublishes synthetic programme"}')
          test "$closed_offering" = "200"
          offering_page=$(curl -sS -o /tmp/offering-register.html -w '%{http_code}' -b /tmp/staff-ci-cookies "http://localhost:4173/app/offerings")
          test "$offering_page" = "200"
          pnpm exec cf d1 raw "$DB" --local --persist-to .cloudflare/state \
            --sql "SELECT (SELECT COUNT(*) FROM public_programme_offerings WHERE code='CI_OFFER_2027' AND application_state='CLOSED' AND is_accepting_applications=0 AND version=3),(SELECT COUNT(*) FROM erp_audit_events WHERE entity_type='programme_offering')" > /tmp/offering-lifecycle.json
          node -e 'const r=require("/tmp/offering-lifecycle.json")[0]?.results?.rows?.[0];if(r?.[0]!==1||r?.[1]!==3)process.exit(1)'


          # Release 3: batch life-cycle and twelve-student maximum.
          echo "Testing batches against isolated local D1"
          anonymous_batch=$(curl -sS -o /tmp/ci-anonymous-batches.json -w '%{http_code}' "http://localhost:4173/api/staff/batches")
          test "$anonymous_batch" = "401"
          invalid_batch=$(curl -sS -o /tmp/ci-invalid-batch.json -w '%{http_code}' -b /tmp/staff-ci-cookies -X POST "http://localhost:4173/api/staff/batches" \
            -H "Origin: http://localhost:4173" -H "Content-Type: application/json" \
            --data '{"code":"CI_TOO_BIG","name":"Invalid oversized class","offeringId":"sa-ssc-science","yearId":"","capacity":13,"beginsOn":"","endsOn":"","reason":"Enforce twelve student limit"}')
          test "$invalid_batch" = "400"
          batch_created=$(curl -sS -o /tmp/ci-batch-created.json -w '%{http_code}' -b /tmp/staff-ci-cookies -X POST "http://localhost:4173/api/staff/batches" \
            -H "Origin: http://localhost:4173" -H "Content-Type: application/json" \
            --data '{"code":"CI_BATCH_2027","name":"CI Science Batch A","offeringId":"sa-ssc-science","yearId":"","capacity":12,"beginsOn":"2027-01-01","endsOn":"2027-06-30","reason":"Create planned test batch for CI"}')
          test "$batch_created" = "201"
          batch_id=$(node -e 'const r=require("/tmp/ci-batch-created.json");if(r.status!=="PLANNED")process.exit(1);process.stdout.write(r.id)')
          batch_started=$(curl -sS -o /tmp/ci-batch-started.json -w '%{http_code}' -b /tmp/staff-ci-cookies -X PATCH "http://localhost:4173/api/staff/batches/$batch_id" \
            -H "Origin: http://localhost:4173" -H "Content-Type: application/json" \
            --data '{"name":"CI Science Batch A","capacity":12,"beginsOn":"2027-01-01","endsOn":"2027-06-30","nextStatus":"ACTIVE","expectedVersion":1,"reason":"Activate verified CI classroom"}')
          test "$batch_started" = "200"
          batch_stale=$(curl -sS -o /tmp/ci-batch-stale.json -w '%{http_code}' -b /tmp/staff-ci-cookies -X PATCH "http://localhost:4173/api/staff/batches/$batch_id" \
            -H "Origin: http://localhost:4173" -H "Content-Type: application/json" \
            --data '{"name":"Stale name","capacity":12,"beginsOn":"","endsOn":"","nextStatus":"ACTIVE","expectedVersion":1,"reason":"Stale batch edit must be rejected"}')
          test "$batch_stale" = "409"
          batch_done=$(curl -sS -o /tmp/ci-batch-completed.json -w '%{http_code}' -b /tmp/staff-ci-cookies -X PATCH "http://localhost:4173/api/staff/batches/$batch_id" \
            -H "Origin: http://localhost:4173" -H "Content-Type: application/json" \
            --data '{"name":"CI Science Batch A","capacity":12,"beginsOn":"2027-01-01","endsOn":"2027-06-30","nextStatus":"COMPLETED","expectedVersion":2,"reason":"Complete synthetic batch in CI"}')
          test "$batch_done" = "200"
          reopen_batch=$(curl -sS -o /tmp/ci-batch-reopen.json -w '%{http_code}' -b /tmp/staff-ci-cookies -X PATCH "http://localhost:4173/api/staff/batches/$batch_id" \
            -H "Origin: http://localhost:4173" -H "Content-Type: application/json" \
            --data '{"name":"CI Science Batch A","capacity":12,"beginsOn":"","endsOn":"","nextStatus":"ACTIVE","expectedVersion":3,"reason":"Closed batches cannot reopen"}')
          test "$reopen_batch" = "409"
          batch_page=$(curl -sS -o /tmp/ci-batch-register.html -w '%{http_code}' -b /tmp/staff-ci-cookies "http://localhost:4173/app/batches")
          test "$batch_page" = "200"
          pnpm exec cf d1 raw "$DB" --local --persist-to .cloudflare/state \
            --sql "SELECT (SELECT COUNT(*) FROM academy_batches WHERE code='CI_BATCH_2027' AND capacity=12 AND status='COMPLETED' AND version=3),(SELECT COUNT(*) FROM erp_audit_events WHERE entity_type='academy_batch')" > /tmp/batch-lifecycle.json
          node -e 'const r=require("/tmp/batch-lifecycle.json")[0]?.results?.rows?.[0];if(r?.[0]!==1||r?.[1]!==3)process.exit(1)'

          # Revoking a staff membership removes access even with a live
          # Better Auth session cookie; do not rely on client-side role state.
          pnpm exec cf d1 raw "$DB" --local --persist-to .cloudflare/state \
            --sql "UPDATE staff_memberships SET active=0 WHERE role='OWNER'" > /tmp/revoked.json
          revoked_code=$(curl -sS -o /tmp/revoked-access.json -w '%{http_code}' \
            -b /tmp/staff-ci-cookies "http://localhost:4173/api/staff/prospects")
          echo "revoked staff access HTTP: $revoked_code"
          test "$revoked_code" = "401"
          grep -q "SA-ENQ-" /tmp/sohojac-enquiry.json

          # A valid request creates exactly one prospect in the local D1 database.
          pnpm exec cf d1 raw "$DB" --sql "SELECT COUNT(*) AS n FROM public_enquiries" --local --persist-to .cloudflare/state >/tmp/enquiry-count.json
          node -e 'const fs = require("node:fs"); const data = JSON.parse(fs.readFileSync("/tmp/enquiry-count.json", "utf8")); const count = data[0]?.results?.rows?.[0]?.[0]; if (count !== 1) { console.error("Expected one stored enquiry; got", count); process.exit(1); } console.log("D1 write verified: one enquiry");'

          # A second submission with the same contact must be rate-limited.
          duplicate_status=$(curl -sS -o /tmp/enquiry-duplicate.json -w '%{http_code}' -X POST "http://localhost:4173/api/enquiries" \
            -H "Content-Type: application/json" \
            --data '{"intent":"interest","offeringId":"","studentName":"Smoke Test Student","className":"Class 8","guardianName":"Smoke Test Guardian","mobile":"01700000000","subjectNames":[],"preferredSchedule":"","preferredDays":[],"trialInterest":false,"consent":true,"website":"","turnstileToken":""}')
          echo "duplicate_status: $duplicate_status"
          test "$duplicate_status" = "429"

          # An admission request must never be accepted while applications are closed.
          admission_status=$(curl -sS -o /tmp/enquiry-closed.json -w '%{http_code}' -X POST "http://localhost:4173/api/enquiries" \
            -H "Content-Type: application/json" \
            --data '{"intent":"admission","offeringId":"sa-ssc-science","studentName":"Closed Test Student","className":"Class 10","guardianName":"Closed Test Guardian","mobile":"01700000001","subjectNames":[],"preferredSchedule":"","preferredDays":[],"trialInterest":false,"consent":true,"website":"","turnstileToken":""}')
          echo "admission_status: $admission_status"
          test "$admission_status" = "409"

          # Regression: status notices come from the selected programme, not
          # a stale server-side alert. All changes here are LOCAL test D1 only.
          curl -fsS "http://localhost:4173/interest" > /tmp/interest-general.html
          if grep -q "Applications are closed for the programme you selected" /tmp/interest-general.html; then
            echo "Unexpected closed-offering warning on general interest"; exit 1
          fi
          curl -fsS "http://localhost:4173/interest?intent=interest&offering=sa-ssc-science" > /tmp/interest-closed.html
          grep -q "Applications are closed for this programme" /tmp/interest-closed.html
          curl -fsS "http://localhost:4173/interest?intent=admission&offering=sa-ssc-science" > /tmp/admission-closed.html
          grep -q "Applications are closed for the programme you selected" /tmp/admission-closed.html

          # Simulate reopening one offering and verify the same deep link now
          # reflects D1's current application status without a code change.
          pnpm exec cf d1 raw "$DB" --sql "UPDATE public_programme_offerings SET is_accepting_applications=1, application_state='OPEN' WHERE id='sa-ssc-science'" --local --persist-to .cloudflare/state > /tmp/reopened-offering.json
          curl -fsS "http://localhost:4173/interest?intent=interest&offering=sa-ssc-science" > /tmp/interest-open.html
          grep -q "Applications are currently open for this programme" /tmp/interest-open.html
          if grep -q "Applications are closed for this programme" /tmp/interest-open.html; then
            echo "Open programme still displays closed status"; exit 1
          fi

          # Invalid contact information and untrusted request origins must be rejected.
          invalid_status=$(curl -sS -o /tmp/enquiry-invalid.json -w '%{http_code}' -X POST "http://localhost:4173/api/enquiries" \
            -H "Content-Type: application/json" \
            --data '{"intent":"interest","studentName":"A","className":"Class 8","guardianName":"Test Guardian","mobile":"123","consent":true}')
          echo "invalid_status: $invalid_status"
          test "$invalid_status" = "400"
          origin_status=$(curl -sS -o /tmp/enquiry-origin.json -w '%{http_code}' -X POST "http://localhost:4173/api/enquiries" \
            -H "Origin: https://other.invalid" -H "Content-Type: application/json" --data '{}')
          echo "origin_status: $origin_status"
          test "$origin_status" = "403"

  release:
    name: Auto-release to Cloudflare (when configured)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/staff_crm_better_auth'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: sohojac-production-deploy
      cancel-in-progress: false
    env:
      CF_SEND_TELEMETRY: "false"
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL || 'https://sohojac.com' }}

    steps:
      - name: Check out exact tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check prerequisites and latest commit
        id: ready
        env:
          CF_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_DB_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          WIDGET_SECRET: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CF_DEPLOY_TOKEN:-}" ] ||
             [ -z "${CF_DB_TOKEN:-}" ] ||
             [ -z "${CF_ACCOUNT:-}" ] ||
             [ -z "${TURNSTILE_SITE_KEY:-}" ] ||
             [ -z "${WIDGET_SECRET:-}" ] ||
             [ -z "${AUTH_SECRET:-}" ] ||
             [ "${#AUTH_SECRET}" -lt 32 ]; then
            echo "::notice::Release paused: configure the existing Cloudflare token (Workers Edit and D1 Edit) and Better Auth/Turnstile secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git ls-remote https://github.com/AbdusSattar-70/sohojac.git refs/heads/feature/staff_crm_better_auth | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "::notice::Newer code exists. Skipping stale deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install Node.js 24
        if: steps.ready.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pnpm
        if: steps.ready.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: "12.15.0"
          run_install: false
      - name: Install dependencies
        if: steps.ready.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build and inspect migrations
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          node scripts/check-d1-migrations.mjs
          pnpm run cf-typegen
          pnpm exec tsc --noEmit
          pnpm run build
          pnpm exec cf deploy --prebuilt --mode production --dry-run

      - name: Apply only pending remote D1 migrations
        if: steps.ready.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DB=d6f3e4e9-2190-43bf-bc90-969687f6db78
          pnpm exec cf d1 migrations list "$DB"
          printf 'y\n' | pnpm exec cf d1 migrations apply "$DB"

      - name: Deploy Worker with stable Better Auth and Turnstile secrets
        if: steps.ready.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          set -euo pipefail
          node -e 'const fs=require("node:fs"); const p=require("node:path"); fs.writeFileSync(p.join(process.env.RUNNER_TEMP,"sohojac-deploy-secrets.json"),JSON.stringify({ TURNSTILE_SECRET_KEY:process.env.TURNSTILE_SECRET_KEY, BETTER_AUTH_SECRET:process.env.BETTER_AUTH_SECRET }),{ mode:0o600 });'
          trap 'rm -f "$RUNNER_TEMP/sohojac-deploy-secrets.json"' EXIT
          pnpm exec cf deploy --prebuilt --mode production --secrets-file "$RUNNER_TEMP/sohojac-deploy-secrets.json"

      - name: Check production public routes and private API denial
        if: steps.ready.outputs.ready == 'true'
        run: |
          set -euo pipefail
          for url in https://sohojac.com/ https://sohojac.com/interest https://sohojac.com/sign-in; do
            curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 20 "$url" >/dev/null
          done
          status=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' https://sohojac.com/api/staff/prospects)
          test "$status" = "401" || { echo "::error::Private prospect endpoint returned HTTP $status instead of 401"; exit 1; }
          status=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' https://sohojac.com/api/staff/academic-years)
          test "$status" = "401" || { echo "::error::Academic year endpoint returned HTTP $status instead of 401"; exit 1; }
          echo "Academic-year endpoint deployed with anonymous access denied."
          status=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' https://sohojac.com/api/staff/offerings)
          test "$status" = "401" || { echo "::error::Programme offering endpoint returned HTTP $status instead of 401"; exit 1; }
          echo "Programme offerings endpoint deployed with anonymous access denied."
          status=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' https://sohojac.com/api/staff/batches)
          test "$status" = "401" || { echo "::error::Batch management endpoint returned HTTP $status instead of 401"; exit 1; }
          echo "Batch management endpoint deployed with anonymous access denied."


          echo "Site healthy; unauthenticated prospect access denied."

