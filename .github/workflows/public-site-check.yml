name: Public Website Checks
on:
  push:
    branches: [feature/public_site_port]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.15.0"
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Cloudflare Worker types
        run: pnpm run cf-typegen
      - name: Verify types
        run: pnpm exec tsc --noEmit
      - name: Apply public D1 migrations locally
        run: |
          DB=d6f3e4e9-2190-43bf-bc90-969687f6db78
          pnpm exec cf d1 migrations apply "$DB" --local
          pnpm exec cf d1 raw "$DB" --sql "SELECT COUNT(*) AS published FROM public_programme_offerings WHERE show_on_website = 1" --local
      - name: Build Cloudflare Worker
        run: pnpm run build
