name: Public Website Checks
on:
  push:
    branches: [feature/public_site_port]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.15.0"
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Cloudflare Worker types
        run: pnpm run cf-typegen
      - name: Verify types
        run: pnpm exec tsc --noEmit
      - name: Apply public D1 migrations locally
        run: |
          DB=d6f3e4e9-2190-43bf-bc90-969687f6db78
          pnpm exec cf d1 migrations apply "$DB" --local
          pnpm exec cf d1 raw "$DB" --sql "SELECT COUNT(*) AS published FROM public_programme_offerings WHERE show_on_website = 1" --local
      - name: Build Cloudflare Worker
        run: pnpm run build

      - name: Smoke test public routes and D1 enquiry
        shell: bash
        run: |
          set -euo pipefail
          pnpm run dev >/tmp/sohojac-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS --max-time 4 http://localhost:5173/ >/tmp/sohojac-home.html; then break; fi
            sleep 1
          done
          for route in / /about /faq /journal /interest /privacy /robots.txt /sitemap.xml; do
            curl -fsS --max-time 12 "http://localhost:5173$route" >/dev/null || {
              cat /tmp/sohojac-vite.log
              exit 1
            }
          done
          grep -q "Learning should be" /tmp/sohojac-home.html
          curl -fsS --max-time 20 -X POST "http://localhost:5173/api/enquiries" \
            -H "Content-Type: application/json" \
            --data '{"intent":"interest","offeringId":"","studentName":"Smoke Test Student","className":"Class 8","guardianName":"Smoke Test Guardian","mobile":"01700000000","subjectNames":["English"],"preferredSchedule":"","preferredDays":[],"trialInterest":false,"consent":true,"website":"","turnstileToken":""}' \
            >/tmp/sohojac-enquiry.json || {
              cat /tmp/sohojac-vite.log
              cat /tmp/sohojac-enquiry.json || true
              exit 1
            }
          grep -q "SA-ENQ-" /tmp/sohojac-enquiry.json
