name: Public Website Checks
on:
  push:
    branches: [feature/public_site_port]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.15.0"
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify types
        run: pnpm exec tsc --noEmit
      - name: Build Cloudflare Worker
        run: pnpm run build
