name: Deploy Sohojac Staff CRM (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sohojac-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy Better Auth staff CRM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CF_SEND_TELEMETRY: "false"
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      BETTER_AUTH_URL: ${{ vars.BETTER_AUTH_URL || 'https://sohojac.com' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/staff_crm_better_auth
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.15.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run cf-typegen
      - run: pnpm exec tsc --noEmit
      - run: pnpm run build
      - run: pnpm exec cf deploy --prebuilt --mode production --dry-run
      - name: Deploy Worker with both secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] ||
             [ -z "${TURNSTILE_SITE_KEY:-}" ] || [ -z "${TURNSTILE_SECRET_KEY:-}" ] ||
             [ -z "${BETTER_AUTH_SECRET:-}" ] || [ "${#BETTER_AUTH_SECRET}" -lt 32 ]; then
            echo "::error::Cloudflare and Turnstile secrets plus a >=32-character BETTER_AUTH_SECRET are required."
            exit 1
          fi
          node -e 'const fs=require("node:fs");const p=require("node:path");fs.writeFileSync(p.join(process.env.RUNNER_TEMP,"sohojac-staff-secrets.json"),JSON.stringify({TURNSTILE_SECRET_KEY:process.env.TURNSTILE_SECRET_KEY,BETTER_AUTH_SECRET:process.env.BETTER_AUTH_SECRET}),{mode:0o600})'
          trap 'rm -f "$RUNNER_TEMP/sohojac-staff-secrets.json"' EXIT
          pnpm exec cf deploy --prebuilt --mode production --secrets-file "$RUNNER_TEMP/sohojac-staff-secrets.json"
