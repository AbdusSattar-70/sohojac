name: Initialize Sohojac Staff CRM (one time)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Enter INITIALIZE_STAFF_CRM to acknowledge this creates D1 schema and the first owner"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: sohojac-staff-initialize
  cancel-in-progress: false

jobs:
  initialize:
    if: inputs.confirmation == 'INITIALIZE_STAFF_CRM'
    name: Apply staff schema and create first owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/staff_crm_better_auth
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          version: "12.15.0"
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Apply reviewed D1 migrations to existing database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Set D1 API token and Cloudflare account ID first"; exit 1
          fi
          DB=d6f3e4e9-2190-43bf-bc90-969687f6db78
          pnpm exec cf d1 migrations list "$DB"
          printf 'y\n' | pnpm exec cf d1 migrations apply "$DB"
      - name: Provision initial OWNER account (one time, no signup endpoint)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SOHOJAC_INITIAL_OWNER_EMAIL: ${{ secrets.SOHOJAC_INITIAL_OWNER_EMAIL }}
          SOHOJAC_INITIAL_OWNER_PASSWORD: ${{ secrets.SOHOJAC_INITIAL_OWNER_PASSWORD }}
          SOHOJAC_INITIAL_OWNER_NAME: "Sohojac Owner"
        run: node scripts/bootstrap-staff-owner.mjs
