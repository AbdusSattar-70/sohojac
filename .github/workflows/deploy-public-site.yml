name: Deploy Sohojac Public Website

# This is intentionally manual only. No pushes or pull requests deploy production.
# GitHub requires workflow_dispatch workflows to exist on the default branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sohojac-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy feature/public_site_port
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CF_SEND_TELEMETRY: "false"
      TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
    steps:
      - name: Check out public-site branch (not master)
        uses: actions/checkout@v4
        with:
          ref: feature/public_site_port
          persist-credentials: false

      - name: Install Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12.15.0"
          run_install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Worker types
        run: pnpm run cf-typegen

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Build production Worker
        run: pnpm run build

      - name: Validate build without uploading
        run: pnpm exec cf deploy --prebuilt --mode production --dry-run

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to GitHub repository Actions secrets before running this workflow."
            exit 1
          fi
          if [ -z "${TURNSTILE_SITE_KEY:-}" ] || [ -z "${TURNSTILE_SECRET_KEY:-}" ]; then
            echo "::error::Set GitHub Actions variable TURNSTILE_SITE_KEY and repository secret TURNSTILE_SECRET_KEY before deploying public registrations."
            exit 1
          fi
          # Upload the Turnstile secret with the Worker on every release.
          # Never print the value or store it in git.
          node -e 'const fs = require("node:fs"); const path = require("node:path"); fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "sohojac-secrets.json"), JSON.stringify({ TURNSTILE_SECRET_KEY: process.env.TURNSTILE_SECRET_KEY }), { mode: 0o600 });'
          trap 'rm -f "$RUNNER_TEMP/sohojac-secrets.json"' EXIT
          pnpm exec cf deploy --prebuilt --mode production --secrets-file "$RUNNER_TEMP/sohojac-secrets.json"
